{{- /* Click-to-load YouTube embed: shows the thumbnail only, loads the player (youtube-nocookie) on click. */ -}}
{{- $start := int (.start | default 0) -}}
<div class="yt" data-yt="{{ .id }}"{{ with $start }} data-start="{{ . }}"{{ end }}>
  <a class="yt-btn" href="https://www.youtube.com/watch?v={{ .id }}{{ with $start }}&amp;t={{ . }}s{{ end }}" aria-label="Play video: {{ .title }}">
    <img src="https://i.ytimg.com/vi/{{ .id }}/hqdefault.jpg" alt="" loading="lazy" width="480" height="360">
    <span class="yt-play" aria-hidden="true"><svg viewBox="0 0 68 48"><path d="M66.5 7.7A8.5 8.5 0 0 0 60.5 1.7C55.2.2 34 .2 34 .2s-21.2 0-26.5 1.5a8.5 8.5 0 0 0-6 6C0 13 0 24 0 24s0 11 1.5 16.3a8.5 8.5 0 0 0 6 6C12.8 47.8 34 47.8 34 47.8s21.2 0 26.5-1.5a8.5 8.5 0 0 0 6-6C68 35 68 24 68 24s0-11-1.5-16.3z" fill="#e00"/><path d="M45 24 27 14v20z" fill="#fff"/></svg></span>
  </a>
</div>
