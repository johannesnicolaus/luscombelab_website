<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }} section-{{ .Section | default "home" }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{- partial "header.html" . }}
  <main id="main">
    {{- block "main" . }}{{ end }}
  </main>
  {{- partial "footer.html" . }}
  {{- $js := resources.Get "js/main.js" | js.Build (dict "minify" true "target" "es2018") | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
